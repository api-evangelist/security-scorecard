aid: security-scorecard

name: SecurityScorecard

description: 'SecurityScorecard is a cybersecurity ratings and third-party risk management platform that continuously rates the security posture
  of any company from the outside in, producing an A-F security score across ten risk factors. Its REST API (base https://api.securityscorecard.io)
  lets customers manage portfolios of monitored companies, pull scorecards, factor scores, historical trends, issues/findings, industry benchmarks,
  and generate reports, and react to changes through webhook-driven Rules. Authentication is a static API token ("Authorization: Token <key>"),
  and first-party npm SDK and CLI packages are published under the @securityscorecard organization. Originally surfaced as a GV (Google Ventures)
  portfolio company, this profile has been enriched from SecurityScorecard''s public developer documentation.'

