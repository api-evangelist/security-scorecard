openapi: 3.2.0
info:
  title: SecurityScorecard Ip Domain Tags API
  version: 1.9.73
  contact:
    name: SecurityScorecard Support
    email: support@securityscorecard.io
  description: 'SecurityScorecard enables users to instantly rate and understand the security

    risk of any company.'
  x-logo:
    url: https://platform.securityscorecard.io/images/ssc-logo-white-stacked.svg
    backgroundColor: '#222830'
servers:
- url: https://api.securityscorecard.io
security:
- Token: []
tags:
- name: ip-domain-tags
paths:
  /ip-domain-tags:
    get:
      summary: Get all ip domain tags
      responses:
        '200':
          description: Get all ip domain tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tagSchema'
      operationId: getApi
      tags:
      - ip-domain-tags
      parameters: []
    post:
      summary: Create an ip domain tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpTagRequest'
        required: true
      responses:
        '200':
          description: Create an ip domain tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpTagResponse'
      operationId: postApi
      tags:
      - ip-domain-tags
      parameters: []
  /ip-domain-tags/groups:
    get:
      summary: Get all ip domain tag groups
      responses:
        '200':
          description: Get all ip domain tag groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpDomainsTagGroupsResponse'
      operationId: getByParentdomainTagGroups
      tags:
      - ip-domain-tags
      parameters: []
    post:
      summary: Create a new ip domain tag group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpDomainTagGroupRequest'
        required: true
      responses:
        '200':
          description: tag group schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createIpDomainTagGroupResponse'
      operationId: postApiTagGroups
      tags:
      - ip-domain-tags
      parameters: []
  /ip-domain-tags/groups/{id}:
    get:
      summary: Get an ip domain tag group
      parameters:
      - in: path
        name: id
        required: true
        example: a8511657-3f69-5355-91ea-b6983d900fe7
        schema:
          type: string
        description: tag group id
      responses:
        '200':
          description: Ip Domain Tag Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpDomainTagGroupResponse'
      operationId: getApiTagGroupsById
      tags:
      - ip-domain-tags
    put:
      summary: Edit an ip domain tag group
      parameters:
      - in: path
        name: id
        required: true
        example: a8511657-3f69-5355-91ea-b6983d900fe7
        schema:
          type: string
        description: tag group id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpDomainTagGroupPayload'
        required: true
      responses:
        '200':
          description: Scorecard Tag Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpDomainTagGroupResponse'
      operationId: putApiTagGroupsById
      tags:
      - ip-domain-tags
    delete:
      summary: Delete an ip domain tag group
      parameters:
      - in: path
        name: id
        required: true
        example: a8511657-3f69-5355-91ea-b6983d900fe7
        schema:
          type: string
        description: tag group id
      responses:
        '204':
          description: No Content
      operationId: deleteApiTagGroupsById
      tags:
      - ip-domain-tags
  /ip-domain-tags/parent-domains/{parentDomain}/domains:
    get:
      summary: Get all the domain tags of the parent domain
      parameters:
      - in: path
        name: parentDomain
        required: true
        example: securityscorecard.com
        schema:
          type: string
        description: parent domain
      responses:
        '200':
          description: Get all the domain tags of the parent domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allDomainsTagsResponseSchema'
      operationId: getApiByParentdomainDomainRelatedTags
      tags:
      - ip-domain-tags
  /ip-domain-tags/parent-domains/{parentDomain}/ips:
    get:
      summary: Get all the ip tags of the parent domain
      parameters:
      - in: path
        name: parentDomain
        required: true
        example: securityscorecard.com
        schema:
          type: string
        description: parent domain
      responses:
        '200':
          description: Get all the domain tags of the parent domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allIpsTagsResponseSchema'
      operationId: getApiByParentdomainIpRelatedTags
      tags:
      - ip-domain-tags
  /ip-domain-tags/{tagId}:
    put:
      summary: Edit an ip domain tag
      parameters:
      - in: path
        name: tagId
        required: true
        example: a8511657-3f69-5355-91ea-b6983d900fe7
        schema:
          type: string
        description: tag id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpDomainTagRequest'
        required: true
      responses:
        '200':
          description: Updated ip domain tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateIpDomainTagResponse'
      operationId: putApiByTagid
      tags:
      - ip-domain-tags
    delete:
      summary: Delete an ip domain tag
      parameters:
      - in: path
        name: tagId
        required: true
        example: a8511657-3f69-5355-91ea-b6983d900fe7
        schema:
          type: string
        description: tag id
      responses:
        '204':
          description: No Content
      operationId: deleteApiByTagid
      tags:
      - ip-domain-tags
  /ip-domain-tags/{tagId}/groups/{tagGroupId}:
    post:
      summary: Add ip domain tag to a ip domain tag group
      parameters:
      - in: path
        name: tagGroupId
        required: true
        schema:
          type: string
        description: tag group id
      - in: path
        name: tagId
        required: true
        schema:
          type: string
        description: tag id
      responses:
        '200':
          description: tag group schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addIpDomainTagToTagGroupSchemaResponse'
      operationId: postApiGroupsByTaggroupidAssociationByTagid
      tags:
      - ip-domain-tags
    delete:
      summary: Remove ip domain tag to a ip domain tag group
      parameters:
      - in: path
        name: tagGroupId
        required: true
        schema:
          type: string
        description: tag group id
      - in: path
        name: tagId
        required: true
        schema:
          type: string
        description: tag id
      responses:
        '200':
          description: tag group schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/removeIpDomainTagToTagGroupResponse'
      operationId: deleteApiGroupsByTaggroupidAssociationByTagid
      tags:
      - ip-domain-tags
  /ip-domain-tags/{tagId}/parent-domains/{parentDomain}/domain/{domain}:
    post:
      summary: Add a tag to a domain
      parameters:
      - in: path
        name: parentDomain
        required: true
        schema:
          type: string
        description: parent domain
      - in: path
        name: domain
        required: true
        schema:
          type: string
        description: domain
      - in: path
        name: tagId
        required: true
        schema:
          type: string
        description: tag id
      responses:
        '200':
          description: domain association schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addIpDomainTagToDomainResponse'
      operationId: postApiByParentdomainDomainByDomainAssociateTagsByTagid
      tags:
      - ip-domain-tags
    delete:
      summary: Remove a tag from a domain
      parameters:
      - in: path
        name: parentDomain
        required: true
        schema:
          type: string
        description: parent domain
      - in: path
        name: domain
        required: true
        schema:
          type: string
        description: domain
      - in: path
        name: tagId
        required: true
        schema:
          type: string
        description: tag id
      responses:
        '200':
          description: domain association schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/removeDomainTagToDomainSchemaReponse'
      operationId: deleteApiByParentdomainDomainByDomainAssociateTagsByTagid
      tags:
      - ip-domain-tags
  /ip-domain-tags/{tagId}/parent-domains/{parentDomain}/ip/{ip}:
    post:
      summary: Add a tag to an ip
      parameters:
      - in: path
        name: parentDomain
        required: true
        schema:
          type: string
        description: parent domain
      - in: path
        name: ip
        required: true
        example: 123.1.44.21
        schema:
          type: string
        description: ''
      - in: path
        name: tagId
        required: true
        schema:
          type: string
        description: tag id
      responses:
        '200':
          description: ip association schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addIpDomainTagResponse'
      operationId: postApiByParentdomainIpByIpAssociateTagsByTagid
      tags:
      - ip-domain-tags
    delete:
      summary: Remove a tag from an ip
      parameters:
      - in: path
        name: parentDomain
        required: true
        schema:
          type: string
        description: parent domain
      - in: path
        name: ip
        required: true
        example: 123.1.44.21
        schema:
          type: string
        description: ''
      - in: path
        name: tagId
        required: true
        schema:
          type: string
        description: tag id
      responses:
        '200':
          description: ip association schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpTagResponse'
      operationId: deleteApiByParentdomainIpByIpAssociateTagsByTagid
      tags:
      - ip-domain-tags
  /parent-domains/{parentDomain}/domains:
    post:
      summary: Get all the domains for the parent domain
      parameters:
      - in: path
        name: parentDomain
        required: true
        schema:
          type: string
        description: parent domain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainsFiltersSchema'
        required: true
      responses:
        '200':
          description: Get all the domains for the parent domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainAssetsResponseSchema'
      operationId: postByParentdomainAssetsDomains
      tags:
      - ip-domain-tags
  /parent-domains/{parentDomain}/ips:
    post:
      summary: Get all the ips for the parent domain
      parameters:
      - in: path
        name: parentDomain
        required: true
        schema:
          type: string
        description: parent domain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltersAndPaginationSchema'
        required: true
      responses:
        '200':
          description: Get all the ips for the parent domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllIpsFromParentDomainResponseSchema'
      operationId: postByParentdomainAssetsIps
      tags:
      - ip-domain-tags
components:
  schemas:
    addIpDomainTagToTagGroupSchemaResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identifier of the tag
        organization_id:
          type: string
          example: Tag organization id
        name:
          type: string
          example: Tag name
        tags:
          type: array
          description: array of tag ids
          items: {}
        description:
          type: string
          example: Tag description
      required:
      - id
      - name
      - tags
      - description
      description: tag group schema
    createIpDomainTagGroupResponse:
      type: object
      additionalProperties: false
      properties:
        organization_id:
          type: string
          description: tag organization id
        id:
          type: string
          description: tag organization id
        name:
          type: string
          description: tag name
        tags:
          type: array
          description: array of tag ids
          items: {}
        description:
          type: string
          description: tag description
      required:
      - id
      - name
      - tags
      - description
      description: ip domain tag group payload
    IpDomainsTagGroupsResponse:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              organization_id:
                type: string
                description: tag organization id
              id:
                type: string
                description: tag organization id
              name:
                type: string
                description: tag name
              tags:
                type: array
                description: array of tag ids
                items: {}
              description:
                type: string
                description: tag description
            required:
            - id
            - name
            - tags
            - description
      required:
      - entries
      description: Get all ip domain tag groups
    addIpDomainTagToDomainResponse:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
          example: Domain
        tags:
          type: array
          description: array of tag ids
          items: {}
        organization_id:
          type: string
          example: Tag organization id
      required:
      - domain
      - tags
      - organization_id
      description: domain association schema
    allIpsTagsResponseSchema:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            type: object
            description: a scorecard tag
            additionalProperties: false
            properties:
              id:
                type: string
                description: tag id
              name:
                type: string
                example: tag name
            required:
            - id
            - name
    DomainAssetsResponseSchema:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              domain:
                type: string
                description: domain asset
              status:
                type: string
                enum:
                - CLAIMED
                - ATTRIBUTED
                - REFUTED
                - UNDER_REVIEW_ADD
                - UNDER_REVIEW_REMOVE
                description: status of asset
              issues:
                type: number
                description: number of issue types associated with the asset
              findings:
                type: number
                description: number of findings associated with the asset
              score_impact:
                type: number
                description: sum impact of issue findings associated with the asset
              age:
                type: number
                description: how long the asset has been attributed
              domain_type:
                type: string
                enum:
                - SUBDOMAIN
                - PARENT DOMAIN
                description: type of domain
              ips_count:
                type: number
                description: count of associated ips
              sources_metadata:
                type: array
                description: metadata for data sources
                items: {}
              first_observed_at:
                type: string
                description: date of the first attribution
              criticality:
                type: string
                description: criticality of the domain asset
              tags:
                type: array
                description: associated tags
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      description: tag id
                    tag:
                      type: string
                      description: tag name
                minItems: 0
              public_tags:
                type: array
                description: associated public tags
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      description: tag id
                    tag:
                      type: string
                      description: tag name
                minItems: 0
              evidence_sources:
                type: array
                description: data sources used to associate the asset to footprint
                items:
                  type: string
              asset_categories:
                type: array
                description: asset category list
                items:
                  type: string
              assignees:
                type: object
                properties:
                  user:
                    type: string
                    description: user
                  team:
                    type: string
                    description: team
              sources:
                type: array
                description: data sources used to associate the asset to footprint
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      description: source id
                    name:
                      type: string
                      description: source name
                minItems: 0
            required:
            - domain
            - status
            - domain_type
            - ips_count
            - first_observed_at
            - criticality
        size:
          type: number
      required:
      - entries
      - size
      description: Schema for domain assets and associated metadata
    AllIpsFromParentDomainResponseSchema:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - ip
            - status
            - detection
            - sources
            - domains_count
            - country
            - domains
            properties:
              ip:
                type: string
                description: ip asset belonging to domain
              status:
                type: string
                enum:
                - CLAIMED
                - ATTRIBUTED
                - REFUTED
                - UNDER_REVIEW_ADD
                - UNDER_REVIEW_REMOVE
                description: status of asset
              issues:
                type: number
                description: number of issue types associated with the asset
              findings:
                type: number
                description: number of findings associated with the asset
              score_impact:
                type: number
                description: sum impact of issue findings associated with the asset
              age:
                type: number
                description: how long the asset has been attributed
              detection:
                type: array
                items:
                  type: string
                description: detection methods
              sources:
                type: array
                items:
                  type: string
                description: data sources used to associate the asset to footprint
              sources_metadata:
                type: array
                items: {}
                description: metadata for data sources
              user_contributed:
                type: array
                items: {}
                description: user contributed metadata
              domains_count:
                type: number
                description: count of domains associated with the ip asset
              country:
                type: object
                additionalProperties: false
                required:
                - country_abbr
                - name
                properties:
                  country_abbr:
                    type: string
                    description: country abbreviation
                  name:
                    type: string
                    description: name of the country
              domains:
                type: array
                items:
                  type: string
                description: top 30 associated domains
              evidence_sources:
                type: array
                items:
                  type: string
                description: data sources used to associate the asset to footprint
              first_observed_at:
                type: string
                description: date of the first attribution
              tags:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: tag id
                    tag:
                      type: string
                      description: tag name
                description: associated tags
              asset_categories:
                type: array
                items:
                  type: string
                description: asset category list
              hostnames:
                type: array
                items:
                  type: string
                description: associated hostnames
              assignees:
                type: object
                properties:
                  user:
                    type: string
                    description: user
                  team:
                    type: string
                    description: team
        size:
          type: number
      required:
      - entries
      - size
    IpTagRequest:
      type: object
      additionalProperties: false
      properties:
        tag:
          type: string
          example: tag name
        description:
          type: string
          example: tag description
      required:
      - tag
      description: ip domain tag payload
    removeIpDomainTagToTagGroupResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identifier of the tag
        organization_id:
          type: string
          example: Tag organization id
        name:
          type: string
          example: Tag name
        tags:
          type: array
          description: array of tag ids
          items: {}
        description:
          type: string
          example: Tag description
      required:
      - id
      - name
      - tags
      - description
      description: tag group schema
    DomainsFiltersSchema:
      type: object
      additionalProperties: false
      properties:
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              operator:
                type: string
                description: boolean operator - must be the same for all filters
                enum:
                - and
                - or
                example: and
              field:
                type: string
                description: column name used for filtering
                enum:
                - status
                - findings
                - issues
                - scoreImpact
                - domain
                - domainType
                - ips
                - ipsCount
                - criticality
                - tags
                - assetCategories
                example: ip
              condition:
                type: string
                description: condition that's used for comparing field value to input value
                enum:
                - '='
                - '!='
                - '>'
                - <
                - '>='
                - <=
                - contains
                - does_not_contain
                - between
                - is_not_between
                - includes_all
                - includes_any
                - excludes_all
                - '<<'
                example: '='
              value:
                oneOf:
                - type: string
                  description: single value
                - type: array
                  items:
                    type: string
                  description: array of two strings
                description: "\n                filters input values. For range comparisons like 'between', provide an array of two strings\n                or a single string"
            required:
            - operator
            - field
            - condition
            - value
        sort:
          type: string
          description: field to sort by. Recommended value is domain. Pagination stability is not guaranteed without a sort value; omitting sort can produce inconsistent, incomplete, or duplicate domains between pages, so always include it when paginating.
          default: domain
          enum:
          - status
          - -status
          - findings
          - -findings
          - issues
          - -issues
          - scoreImpact
          - -scoreImpact
          - domain
          - -domain
          - ipsCount
          - -ipsCount
          - criticality
          - -criticality
          - assetCategories
          - -assetCategories
        page:
          type: number
          description: required page number, first page is 0
          default: 0
        page_size:
          type: number
          description: size of the pages in the paginated result
          default: 50
      required:
      - page
      - page_size
      description: Schema for filters, sorting, pagination, and related properties
    updateIpDomainTagResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identifier of the tag
        organization_id:
          type: string
          example: Tag organization id
        tag:
          type: string
          example: Tag name
        description:
          type: string
          example: Tag description
      required:
      - id
      - tag
      - description
      description: Updated ip domain tag
    IpDomainTagGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: tag group name
        description:
          type: string
          default: ''
          description: tag group description
      required:
      - name
      description: ip domain tag group payload
    IpTagResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identifier of the tag
        organization_id:
          type: string
          example: Tag organization id
        tag:
          type: string
          example: Tag name
        description:
          type: string
          example: Tag description
        ip:
          type: string
          example: ip
        tags:
          type: array
          description: array of tag ids
          items: {}
      required:
      - id
      - tag
      - description
      description: a tag
    allDomainsTagsResponseSchema:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            type: object
            description: a scorecard tag
            additionalProperties: false
            properties:
              id:
                type: string
                description: tag id
              name:
                type: string
                example: tag name
            required:
            - id
            - name
    FiltersAndPaginationSchema:
      type: object
      additionalProperties: false
      properties:
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - operator
            - field
            - condition
            - value
            properties:
              operator:
                type: string
                enum:
                - and
                - or
                description: boolean operator - must be the same for all filters
                example: and
              field:
                type: string
                enum:
                - status
                - findings
                - issues
                - scoreImpact
                - ip
                - domain
                - country
                - tags
                - assetCategories
                description: column name used for filtering
                example: ip
              condition:
                type: string
                enum:
                - '='
                - '!='
                - '>'
                - <
                - '>='
                - <=
                - contains
                - does_not_contain
                - between
                - is_not_between
                - includes_all
                - includes_any
                - excludes_all
                - '<<'
                description: condition that's used for comparing field value to input value
                example: '='
              value:
                type: array
                items:
                  type: string
                description: array of strings; exactly 2 elements required for "between"/"is_not_between" conditions
                example:
                - 127.0.0.1
                - 192.168.1.1
        sort:
          type: string
          enum:
          - findings
          - -findings
          - issues
          - -issues
          - scoreImpact
          - -scoreImpact
          - ip
          - -ip
          - domain
          - -domain
