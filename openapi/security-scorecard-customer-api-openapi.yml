      x-operation-id-source: derived
  /max/customer/vendors:
    get:
      summary: Get max customer vendors
      description: Get all vendors for current customer
      tags:
      - Customer
      parameters:
      - in: query
        name: search
        required: false
        example: ''
        schema:
          type: string
        description: Search text to look for vendor name, vendor domain or customer name.
      - in: query
        name: sort
        required: false
        example: '[{"id":"tier","desc":true}]'
        schema:
          type: string
        description: Sort vendors by providing a JSON string representing an array of objects; each object should include "id" for the column to sort by and "desc" as a boolean indicating descending (true) or ascending (false) order.
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - in: query
        name: vendor_name
        required: false
        schema:
          type: string
        description: Vendor name filter, accepts single value or comma separated list of vendor names.
      - in: query
        name: customer_name
        required: false
        schema:
          type: string
        description: Customer name filter, accepts single value or comma separated list of customer names.
      - in: query
        name: tier
        required: false
        example: platinum, gold, silver
        schema:
          type: string
        description: Tier filter, accepts single value or comma separated list of tiers.
      - in: query
        name: lifecycle
        required: false
        example: assess, monitor, respond, maintain
        schema:
          type: string
        description: Lifecycle filter, accepts single value or comma separated list of lifecycle values.
      - in: query
        name: status
        required: false
