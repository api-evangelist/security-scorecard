openapi: 3.2.0
info:
  title: SecurityScorecard Customer API
  version: 0.0.1
  contact:
    name: SecurityScorecard Support
    email: support@securityscorecard.io
  description: 'For onboarding instructions and details on how SecurityScorecard API works,

    please see our Readme guide: https://securityscorecard.readme.io/docs


    For technical support please contact us at

    support@securityscorecard.io. We typically

    respond in 48 hours and operate Monday thru Friday 9am - 5pm EST (excluding

    US federal holidays).'
  x-logo:
    url: https://platform.securityscorecard.io/images/ssc-logo-white-stacked.svg
    backgroundColor: '#222830'
servers:
- url: https://api.securityscorecard.io
security:
- Token: []
tags:
- name: Customer
paths:
  /max/customer/breaches:
    get:
      summary: Get max customer breaches
      description: Gets breaches for the current customer
      tags:
      - Customer
      parameters:
      - in: query
        name: triaged
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter findings that are set to be triaged
      - in: query
        name: report
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter findings that are set to be reported
      - in: query
        name: vendor_id
        required: false
        example: aea7dae2-370f-4279-a458-4c7cb9661778
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: Vendor ID filter, accepts single value or comma separated list of vendor ids
      - in: query
        name: vendor_domain
        required: false
        example: securityscorecard.com
        schema:
          type: string
        description: Vendor domain filter, accepts single value or comma separated list of vendor domains
      - in: query
        name: vendor_name
        required: false
        example: SecurityScorecard
        schema:
          type: string
        description: Vendor name filter, accepts single value or comma separated list of vendor names
      - in: query
        name: published_at
        required: false
        example: '{"operator":"gte","value":"2025-01-01"}'
        schema:
          type: string
        description: Published date filter, accept stringified object with date value and operator
      - in: query
        name: recent_only
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Set true to get just recently triaged breaches along with the not triaged ones
      - in: query
        name: search
        required: false
        example: foo bar
        schema:
          type: string
        description: Word or phrase to search records for
      - in: query
        name: sort
        required: false
        example: '{"column":"published_at","order":"desc"}'
        schema:
          type: string
        description: Stringified object with value for column to order by and operator
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: Breaches list for the given filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreachesList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: getMaxCustomerBreaches
      x-operation-id-source: derived
  /max/customer/documents:
    get:
      summary: Get max customer documents
      description: Get list of documents related to a customer.
      tags:
      - Customer
      parameters:
      - in: query
        name: filter
        required: false
        example: '[{"operator":"like","id":"filename","value":["test"],"type":"multiValue"},{"operator":"lt","id":"date","value":["2025-01-01"],"type":"date"},{"operator":"like","id":"uploaded_by","value":["someone@securityscorecard.io"],"type":"multiValue"},{"operator":"like","id":"associated_vendors","value":["securityscorecard.io"],"type":"multiValue"}]'
        schema:
          type: string
        description: Filters to apply to the documents
      - in: query
        name: search
        required: false
        example: foo bar
        schema:
          type: string
        description: Word or phrase to search records for
      - in: query
        name: sort
        required: false
        example: '[{"id":"date","desc":"true"}]'
        schema:
          type: string
        description: stringified object with value for column to order by and operator
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: A list of documents for the specified customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsListSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: getMaxCustomerDocuments
      x-operation-id-source: derived
    post:
      summary: Create max customer documents
      description: Upload a document.
      tags:
      - Customer
      parameters:
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentToUploadSchema'
        required: true
      responses:
        '201':
          description: A document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: postMaxCustomerDocuments
      x-operation-id-source: derived
    put:
      summary: Replace max customer documents
      description: Edit a document metadata.
      tags:
      - Customer
      parameters:
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentToUpdateSchema'
        required: true
      responses:
        '200':
          description: An updated document ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: putMaxCustomerDocuments
      x-operation-id-source: derived
  /max/customer/documents/{id}:
    get:
      summary: Get max customer documents by id
      description: Get url of a document.
      tags:
      - Customer
      parameters:
      - in: path
        name: id
        required: true
        example: aea7dae2-370f-4279-a458-4c7cb9661778
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: Document identifier
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: A url of a document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUrlSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: getMaxCustomerDocumentsById
      x-operation-id-source: derived
  /max/customer/findings:
    get:
      summary: Get max customer findings
      description: Gets triaged and reported findings of current customer
      tags:
      - Customer
      parameters:
      - in: query
        name: with_hostname
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Set true for findings with hostname
      - in: query
        name: all_dates
        required: false
        example: true
        schema:
          type: boolean
        description: Default is false and retrieves 15 days findings, if allDates is true will return 30 days findings
      - in: query
        name: hostname
        required: false
        example: securityscorecard.com
        schema:
          type: string
        description: Hostname filter, accepts single value or comma separated list of hostnames
      - in: query
        name: hostname_matches
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Set true for findings that have matching vendor domain and hostname
      - in: query
        name: max_severity
        required: false
        example: Low
        schema:
          type: string
          enum:
          - Low
          - Medium
          - High
          - Critical
        description: Max Severity filter, accepts single value or comma separated list of max severities
      - in: query
        name: issue_category
        required: false
        example: Suspicious Activity
        schema:
          type: string
        description: Category filter, accepts single value or comma separated list of issue categories
      - in: query
        name: issue_type_key
        required: false
        example: typosquat
        schema:
          type: string
        description: Issue type key filter, accepts single value or comma separated list of issue type keys
      - in: query
        name: vendor_id
        required: false
        example: aea7dae2-370f-4279-a458-4c7cb9661778
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: Vendor ID filter, accepts single value or comma separated list of vendor ids
      - in: query
        name: vendor_domain
        required: false
        example: securityscorecard.com
        schema:
          type: string
        description: Vendor domain filter, accepts single value or comma separated list of vendor domains
      - in: query
        name: vendor_name
        required: false
        example: SecurityScorecard
        schema:
          type: string
        description: Vendor name filter, accepts single value or comma separated list of vendor names
      - in: query
        name: last_seen
        required: false
        example: '{"operator":"gte","value":"2025-01-01"}'
        schema:
          type: string
        description: Last seen filter, accepts stringified object with date value and operator
      - in: query
        name: first_seen
        required: false
        example: '{"operator":"gte","value":"2025-01-01"}'
        schema:
          type: string
        description: First seen filter, accepts stringified object with date value and operator
      - in: query
        name: cve_severity
        required: false
        example: low
        schema:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        description: CVE severity filter, accepts single value or comma separated list of severities
      - in: query
        name: cve_exploited
        required: false
        example: true
        schema:
          type: boolean
        description: True for findings related with a known exploited CVE
      - in: query
        name: business_impacts
        required: false
        example: medium
        schema:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        description: Filter by business impact
      - in: query
        name: search
        required: false
        example: foo bar
        schema:
          type: string
        description: Word or phrase to search records for
      - in: query
        name: sort
        required: false
        example: '[{"id":"first_observed_at","desc":"true"}]'
        schema:
          type: string
        description: stringified object with value for column to order by and operator
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: Findings list for the given filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: getMaxCustomerFindings
      x-operation-id-source: derived
  /max/customer/reports/remediation-plans:
    get:
      summary: Get max customer reports remediation plans
      description: Get list of managed action plans for current customer vendors
      tags:
      - Customer
      parameters:
      - name: filter
        in: query
        description: Filter action plans by specific criteria. The filter should be a JSON string that contains an array of objects, each representing a filter condition.
        schema:
          type: string
        example: '[{"operator":"eq","id":"scorecard","value":["securityscorecard.com"],"type":"multiValueWithAsyncOptions"},{"operator":"eq","id":"managed_scorecard","value":["amazon.com"],"type":"multiValueWithAsyncOptions"},{"operator":"gt","id":"created_at","value":["2025-03-01"],"type":"date"},{"operator":"eq","id":"status","value":["active"],"type":"multiValueWithOptions"},{"operator":"gt","id":"progress","value":[5],"type":"number"},{"operator":"gt","id":"due_date","value":["2025-06-30"],"type":"date"}]'
      - in: query
        name: search
        required: false
        example: '[{"id":"name","value":"test"}]'
        schema:
          type: string
        description: 'Search remediation plans by providing a JSON string that represents an array of objects; each object should include “id” for the field to search and “value” as the term to match. For example, to search plans by name, use { "id": "name", "value": "test" }.'
      - in: query
        name: sort
        required: false
        example: '[{"id":"name","desc":true}]'
        schema:
          type: string
        description: Sort remediation plans by providing a JSON string representing an array of objects; each object should include "id" for the column to sort by and "desc" as a boolean indicating descending (true) or ascending (false) order.
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: A list of action plans visible by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlansList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: getMaxCustomerReportsRemediationPlans
      x-operation-id-source: derived
  /max/customer/updates:
    get:
      summary: Get max customer updates
      description: Get updates for the current customer
      tags:
      - Customer
      parameters:
      - in: query
        name: search
        required: false
        example: '[{"id":"summary","type":"like","value":["test"]}]'
        schema:
          type: string
        description: Search updates by providing a JSON string that represents an array of objects; each object should include “id” for the field to search, “type” for the matching operator (e.g., “like” or “eq”), and “value” as an array of values to compare.
      - in: query
        name: sort
        required: false
        example: '[{"id":"date","desc":true}]'
        schema:
          type: string
        description: Sort updates by providing a JSON string representing an array of objects; each object should include "id" for the column to sort by and "desc" as a boolean indicating descending (true) or ascending (false) order.
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: filter
        in: query
        description: Filter updates by providing a JSON string that represents an array of objects; each object should include “id” for the field to filter, “type” for the operator (e.g., “like” or “eq”), and “value” as an array of values to compare.
        schema:
          type: string
        example: '[{"id":"summary","type":"like","value":["test"]}]'
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: Successfull response containing customer updates with their associated shared documents for the current customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdatesList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
      x-summary-source: derived
      operationId: getMaxCustomerUpdates
      x-operation-id-source: derived
