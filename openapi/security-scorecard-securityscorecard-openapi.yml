openapi: 3.0.3
info:
  title: SecurityScorecard
  version: 0.0.1
  contact:
    name: SecurityScorecard Support
    email: support@securityscorecard.io
  description: 'For onboarding instructions and details on how SecurityScorecard API works,

    please see our Readme guide: https://securityscorecard.readme.io/docs


    For technical support please contact us at

    [support@securityscorecard.io](support@securityscorecard.io). We typically

    respond in 48 hours and operate Monday thru Friday 9am - 5pm EST (excluding

    US federal holidays).'
  x-logo:
    url: https://platform.securityscorecard.io/images/ssc-logo-white-stacked.svg
    backgroundColor: '#222830'
servers:
- url: https://api.securityscorecard.io
security:
- Token: []
paths:
  /footprint/{parentDomain}/attribution-log:
    get:
      summary: Get all the domain tags of the parent domain
      description: ''
      tags:
      - footprint
      parameters:
      - in: path
        name: parentDomain
        required: true
        example: securityscorecard.com
        schema:
          type: string
        description: parent domain
      - in: query
        name: date-from
        required: false
        schema:
          type: string
        description: start date time range
      - in: query
        name: date-to
        required: false
        schema:
          type: string
        description: end date time range
      - in: query
        name: sort-field
        required: false
        schema:
          type: string
        description: sort field
      - in: query
        name: filters
        required: false
        schema:
          type: string
        description: filters field
      - in: query
        name: filter-operator
        required: false
        schema:
          type: string
        description: 'filter operation, expected values: and | or'
      - in: query
        name: page
        required: false
        schema:
          type: number
        description: required page number, first page is 0
      - in: query
        name: page-size
        required: false
        schema:
          type: number
        description: size of the pages in the paginated result
      responses:
        '200':
          description: Get attribution logs of the parent domain
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/getAttributionLogByParentDomainResponseSchema'
                - $ref: '#/components/schemas/EmptyEntriesSizeSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
  /max/customer/breaches:
    get:
      summary: ''
      description: Gets breaches for the current customer
      tags:
      - customer
      parameters:
      - in: query
        name: triaged
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter findings that are set to be triaged
      - in: query
        name: report
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter findings that are set to be reported
      - in: query
        name: vendor_id
        required: false
        example: aea7dae2-370f-4279-a458-4c7cb9661778
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: Vendor ID filter, accepts single value or comma separated list of vendor ids
      - in: query
        name: vendor_domain
        required: false
        example: securityscorecard.com
        schema:
          type: string
        description: Vendor domain filter, accepts single value or comma separated list of vendor domains
      - in: query
        name: vendor_name
        required: false
        example: SecurityScorecard
        schema:
          type: string
        description: Vendor name filter, accepts single value or comma separated list of vendor names
      - in: query
        name: published_at
        required: false
        example: '{"operator":"gte","value":"2025-01-01"}'
        schema:
          type: string
        description: Published date filter, accept stringified object with date value and operator
      - in: query
        name: recent_only
        required: false
        example: 'true'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Set true to get just recently triaged breaches along with the not triaged ones
      - in: query
        name: search
        required: false
        example: foo bar
        schema:
          type: string
        description: Word or phrase to search records for
      - in: query
        name: sort
        required: false
        example: '{"column":"published_at","order":"desc"}'
        schema:
          type: string
        description: Stringified object with value for column to order by and operator
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: Breaches list for the given filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreachesList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
  /max/customer/documents:
    get:
      summary: ''
      description: Get list of documents related to a customer.
      tags:
      - customer
      parameters:
      - in: query
        name: filter
        required: false
        example: '[{"operator":"like","id":"filename","value":["test"],"type":"multiValue"},{"operator":"lt","id":"date","value":["2025-01-01"],"type":"date"},{"operator":"like","id":"uploaded_by","value":["someone@securityscorecard.io"],"type":"multiValue"},{"operator":"like","id":"associated_vendors","value":["securityscorecard.io"],"type":"multiValue"}]'
        schema:
          type: string
        description: Filters to apply to the documents
      - in: query
        name: search
        required: false
        example: foo bar
        schema:
          type: string
        description: Word or phrase to search records for
      - in: query
        name: sort
        required: false
        example: '[{"id":"date","desc":"true"}]'
        schema:
          type: string
        description: stringified object with value for column to order by and operator
      - in: query
        name: page
        required: false
        schema:
          type: integer
        description: optionally specify which page of results to return
      - in: query
        name: limit
        required: false
        example: 25
        schema:
          type: integer
          maximum: 1500
        description: optionally specify how many results to return, maximum is 1500
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: A list of documents for the specified customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsListSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
    post:
      summary: ''
      description: Upload a document.
      tags:
      - customer
      parameters:
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentToUploadSchema'
        required: true
      responses:
        '201':
          description: A document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
    put:
      summary: ''
      description: Edit a document metadata.
      tags:
      - customer
      parameters:
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentToUpdateSchema'
        required: true
      responses:
        '200':
          description: An updated document ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIdSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimit'
  /max/customer/documents/{id}:
