          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: Document identifier
      - name: version
        in: header
        schema:
          type: string
          example: beta
        description: API version header
      responses:
        '200':
          description: A url of a document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUrlSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
