openapi: 3.0.0
info:
  title: ASI internal service
  description: Attack surface intelligence service
  version: 0.0.1
security:
- Token: []
servers:
- url: https://api.securityscorecard.io
paths:
  /asi/details/active-infections/{family}:
    get:
      tags:
      - active-infections
      parameters:
      - in: path
        name: family
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: Active Infections Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAsiActiveInfectionFamilyResponse'
      summary: Attack Surface Intelligence API Active Infection Family Details
  /asi/details/asset/{asset}/port/{port}:
    get:
      tags:
      - asset
      parameters:
      - in: path
        name: asset
        required: true
        schema:
          type: string
        description: ''
      - in: path
        name: port
        required: true
        schema:
          type: integer
        description: ''
      responses:
        '200':
          description: Port Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAsiAssetPortResponse'
      summary: Attack Surface Intelligence API Asset Port Details
  /asi/details/asset/{ip}:
    get:
      tags:
      - asset
      parameters:
      - in: path
        name: ip
        required: true
        example: 123.1.44.21
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: IP Full Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAsiAssetIpResponse'
      summary: Attack Surface Intelligence API Asset IP Details
  /asi/details/cve/domain/{domain}:
    get:
      tags:
      - cve
      summary: Get vulnerability details by domain with a row for each IP + vulnerability
      description: Returns vulnerability details by domain. Each row represents an IP + vulnerability combination. One IP with multiple vulnerabilities will have multiple rows, and one vulnerability affecting multiple assets will also have multiple rows.
      parameters:
      - required: true
        in: path
        name: domain
        schema:
          type: string
        description: Top level domain of organization that the asset is attributed to
      - required: false
        in: query
        name: cve
        schema:
          type: string
        description: Filter for specific CVE (e.g. CVE-2019-6470)
      - required: false
        in: query
        name: ip
        schema:
          type: string
        description: Filter for specific asset IP address
      - required: false
        in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Specify which page of the results to return
      - required: false
        in: query
        name: size
        schema:
          type: integer
          default: 10
        description: Specify the number of results to return per page
      responses:
        '200':
          description: Vulnerability details by domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                          description: Top level domain of organization that the asset is attributed to (e.g. ASUS Global)
                        cve:
                          type: string
                          description: The specific vulnerability (e.g. CVE-2019-6470)
                        ip:
                          type: string
                          description: The asset IP address that the CVE is detected on (e.g. 123.123.123.123)
                        first_seen:
                          type: string
                          format: date-time
                          description: The datetime that the CVE was first detected on the asset
                        last_seen:
                          type: string
                          format: date-time
                          description: The datetime that the CVE was last detected on the asset
                        last_scan:
                          type: string
                          format: date-time
                          description: The datetime that the asset was last scanned by SSC
                      required:
                      - domain
                      - cve
                      - ip
                      - first_seen
                      - last_seen
                      - last_scan
                  page:
                    type: integer
                    description: Current page number
                  size:
                    type: integer
                    description: Number of results per page
                  total:
                    type: integer
                    description: Total number of results
                required:
                - entries
                - page
                - size
                - total
  /asi/details/cve/{cve}:
    get:
      tags:
      - cve
      parameters:
      - in: path
        name: cve
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: CVE Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCveResponse'
      summary: Attack Surface Intelligence API Cve Details
  /asi/details/ransomware/{ransomware}:
    get:
      tags:
      - ransomware
      parameters:
      - in: path
        name: ransomware
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: Ransomware Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAsiRansomwareResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
      summary: Attack Surface Intelligence API Ransomware Details
  /asi/details/threat-actor/{threatActor}:
    get:
      tags:
      - threat-actors
      parameters:
      - in: path
        name: threatActor
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: Threat Actors Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAsiThreatActorsResponse'
      summary: Attack Surface Intelligence API Threat Actors Details
  /asi/facets:
    post:
      tags:
      - search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asiFacetsRequest'
        required: true
      responses:
        '200':
          description: Facets elements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asiFacetsResponse'
      parameters: []
      summary: Attack Surface Intelligence API Facets
  /asi/search:
    post:
      tags:
      - search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asiSearchRequest'
        required: true
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asiSearchResponse'
      parameters: []
      summary: Attack Surface Intelligence API Search
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: "SecurityScorecard API endpoints require an authentication token to be passed\nin an authorization header in order to return data. If you do not already\nhave a token, you can create one by going to the API Access area in your\n[Settings page](https://platform.securityscorecard.io/#/settings/api) and then\nclicking Generate New Token. Please note this tokens have no expiration\nso they can be used until manually revoked. If you have a token and generate\na new one, the previous token will be revoked and can no longer be used.\n\nAdministrators can also revoke API tokens for any user in their account.\n\nOnce you have your token you can pass it in using the `Authorization` http header like this:\n\n```\ncurl -X GET \\\n  https://api.securityscorecard.io/portfolios \\\n  -H 'authorization: Token <your token>'\n```\n"
  schemas:
    asiSearchRequest:
      type: object
      properties:
        query:
          type: string
          description: search query
        sort:
          type: string
          description: 'values for ipv4 are:'
          enum:
          - scan_date
          - max_cvss_score
          - min_scorecard_grade
          - _score
          - avd_grade
          - city
          - cloud_provider
          - cloud_region
          - country_name
          - has_cve
          - has_cve_been_exploited
          - has_infection
          - has_malhash
          - has_malrep
          - has_ransomware
          - has_scorecard
          - has_screenshot
          - has_ssl_cert
          - has_threatactor
          - hostname
          - max_cvss_score
          - min_scorecard_grade
          - postal
          - scan_time
          - ssl_is_certificate_chain_valid
          - state
          - _score
          - has_ransomware
        sortDir:
          type: string
          description: asc or desc
          enum:
          - asc
          - desc
          x-enumDescriptions:
            asc: Ascending
            desc: Descending
        page:
          type: number
          default: 0
          example: 0
          description: Search result page number
        index:
          type: string
          default: ipv4
          example: ipv4
          description: Search index to query
        parser:
          type: string
          default: structured
          example: ipv4
          description: 'Search query parser. Options are: simple, structured, lucence, dismax'
          enum:
          - simple
          - structured
          - lucence
          - dismax
        size:
          type: number
          default: 10
          example: 10
          description: Size of the search resultset page
        cursor:
          type: string
          description: Cursor identifier (or "initial" for first request) needed to paginate over more than 10K results
      additionalProperties: false
