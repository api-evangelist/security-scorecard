                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                description: Identifier
                type: string
              name:
                type: string
                description: human-readable name
                example: Our Vendors
        monitored:
          type: boolean
          description: true or false
          default: false
        business_impact:
          type: string
        lifecycle_status:
          type: string
        data_types_shared:
          type: array
          items:
